# ==============================================================================
# KristaTech Core - Comprehensive Sample Configuration File (kristatech.conf)
# ==============================================================================
# This file contains all the verified configuration options supported by the
# KristaTech Core daemon/wallet client.
#
# File Location:
# - Linux:   ~/.kristatech/kristatech.conf
# - Windows: %APPDATA%\KristaTech\kristatech.conf
# - macOS:   ~/Library/Application Support/KristaTech/kristatech.conf
# ==============================================================================

# ==============================================================================
# 1. BASIC & NETWORK SETTINGS
# ==============================================================================

# Set to 1 to run on test network, 0 for main network.
testnet=1

# Run in the background as a daemon and accept commands (Linux only)
daemon=1

# Accept incoming P2P connections from other nodes (default: 1)
listen=1

# Maintain at most <n> connections to peers (default: 125)
maxconnections=125

# Connect directly to a specific node (speeds up finding peers on the network)
# addnode=157.90.130.224:27999
# addnode=seed1.kristalteknoloji.com

# Connect ONLY to the specified node(s); disables automatic peer connections
# connect=12.34.56.78:27999

# Use UPnP to map the listening port (default: 1)
upnp=1

# Specify your own public IP address to announce to the network
# (Highly recommended for Masternodes)
# externalip=12.34.56.78:27999

# Connect through a SOCKS5 proxy (protects privacy / routes outbound traffic)
# proxy=127.0.0.1:9050

# Use a separate SOCKS5 proxy to reach peers via Tor hidden services
# onion=127.0.0.1:9050

# Automatically create a Tor hidden service (default: 1)
# listenonion=1

# ==============================================================================
# 2. RPC (REMOTE CONNECTION) SETTINGS
# ==============================================================================

# Accept command-line and JSON-RPC commands (required for kristatech-cli)
server=1

# Username and password for JSON-RPC connections (Set a strong password!)
rpcuser=kristatechuser
rpcpassword=kristatechpass_please_change

# Allow JSON-RPC connections only from specified sources.
# Can be specified multiple times.
rpcallowip=127.0.0.1
# rpcallowip=192.168.1.0/24

# Listen for JSON-RPC connections on <port> (Default mainnet: 27979, testnet: 27919)
rpcport=27979

# Set the number of threads to service RPC calls (default: 4)
rpcthreads=4

# Set the depth of the work queue to service RPC calls (default: 16)
rpcworkqueue=16

# Timeout during HTTP/RPC requests in seconds (default: 30)
rpcservertimeout=30

# ==============================================================================
# 3. DATABASE & INDEXING SETTINGS
# ==============================================================================

# Set database cache size in megabytes (default: 400)
# Can be increased to speed up initial sync (e.g. 1024 or 2048)
dbcache=400

# Maintain a full transaction index, used by the getrawtransaction rpc call (default: 1)
txindex=1

# Rebuild block chain index from current blk000??.dat files on startup
# (Requires restarting with this option enabled to fix index issues)
# reindex=1

# ==============================================================================
# 4. WALLET SETTINGS
# ==============================================================================

# Rescan the blockchain for unspent wallet transactions on startup
# (Useful if transactions are missing or balance is incorrect)
# rescan=1

# Set key pool size to <n> pre-generated addresses (default: 100)
keypool=100

# Allow spending unconfirmed change outputs (1: Enabled, 0: Disabled)
spendzeroconfchange=1

# Fee (in KRISTA/kB) to add to transactions you send
# paytxfee=0.0001
# maxtxfee=0.1

# Minimum transaction relay fee
# mintxfee=0.00001

# Delete all wallet transactions and only recover those in the block chain (1 or 2)
# zapwallettxes=1

# ==============================================================================
# 5. COOPERATIVE ADAM CONSENSUS & MINING SETTINGS
# ==============================================================================

# Enable staking functionality (0-1, default: 1)
staking=1

# Enable classic PoW mining (CPU mining) inside the wallet (1: Enabled, 0: Disabled)
# gen=0

# Number of script/mining verification threads (default: -1, 0 = auto)
# genproclimit=4

# --- ADAM CONSENSUS STATIC ADDRESS PARAMETERS ---
# Directs block reward outputs to a static key rather than grabbing a new address 
# from the keypool for every block, which keeps the miner pool clean:

# OPTION A: Mine/Stake to a static wallet address (The private key must belong to this wallet)
# mineraddress=ktKRDuku8HnUvMtpbTVYs1bJaxbAbcQTcgG

# OPTION B: Mine/Stake directly to a compressed 33-byte public key hex
# minerpubkey=02145c77df61f3006603fe22c716cd01505f7a9abe79a76ba00a9a0e9c43a89638

# ==============================================================================
# 6. MASTERNODE SETTINGS
# ==============================================================================

# Enable the client to act as a masternode (0-1, default: 0)
# masternode=1

# Specify masternode ECDSA private key
# masternodeprivkey=93tD5...

# Specify masternode BLS private key (hex format)
# masternodeblsprivkey=64_character_hex_string...

# ==============================================================================
# 7. SPAM & SECURITY SETTINGS
# ==============================================================================

# Use block spam filter to prevent dust/spam staking transactions (default: 1)
blockspamfilter=1

# Maximum size of the block spam filter index list (default: 20000000)
blockspamfiltermaxsize=20000000

# Threshold for disconnecting misbehaving peers (default: 100)
banscore=100

# Number of seconds to keep misbehaving peers from reconnecting (default: 86400)
bantime=86400

# ==============================================================================
# 8. ZMQ (ZERO-MESSAGE QUEUE) NOTIFICATIONS
# ==============================================================================
# ZMQ sockets allow external services (like explorers) to listen to live events:

# zmqpubhashblock=tcp://127.0.0.1:28332
# zmqpubhashtx=tcp://127.0.0.1:28332
# zmqpubrawblock=tcp://127.0.0.1:28332
# zmqpubrawtx=tcp://127.0.0.1:28332

# ==============================================================================
# 9. LOGGING & DEBUGGING SETTINGS
# ==============================================================================

# Debug log categories to write to the debug log. Multiple categories can be set.
# debug=net
# debug=coinstake
# debug=mempool
# debug=rpc
# debug=masternode

# Include IP addresses in debug output (default: 1)
logips=1

# Shrink debug.log file on client startup (default: 1 when no -debug)
shrinkdebugfile=1

# Send trace/debug info to console instead of debug.log file (default: 0)
# printtoconsole=0
