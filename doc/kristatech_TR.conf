# ==============================================================================
# KristaTech Core - Kapsamlı Örnek Konfigürasyon Dosyası (kristatech_TR.conf)
# ==============================================================================
# Bu dosya, KristaTech Core istemcisi (daemon/cüzdan) tarafından desteklendiği
# kod seviyesinde doğrulanmış tüm önemli parametreleri ve açıklamalarını içerir.
#
# Dosya Konumu:
# - Linux:   ~/.kristatech/kristatech.conf
# - Windows: %APPDATA%\KristaTech\kristatech.conf
# - macOS:   ~/Library/Application Support/KristaTech/kristatech.conf
# ==============================================================================

# ==============================================================================
# 1. TEMEL VE AĞ AYARLARI (Basic & Network Settings)
# ==============================================================================

# Testnet ağında çalışmak için 1, ana ağda (Mainnet) çalışmak için 0 yapın.
testnet=1

# Arka planda daemon (servis) olarak çalışıp çalışmayacağı (Linux sunucular için 1)
daemon=1

# Dışarıdan gelen P2P bağlantıları kabul et (varsayılan: 1)
listen=1

# Maksimum eş zamanlı bağlantı sayısı (varsayılan: 125)
maxconnections=125

# Belirli bir düğüme doğrudan bağlanmak için (Ağda diğer düğümleri bulmayı hızlandırır)
# addnode=157.90.130.224:27999
# addnode=seed1.kristalteknoloji.com

# YALNIZCA belirtilen düğüme bağlan, ağdaki diğer düğümleri otomatik arama
# connect=12.34.56.78:27999

# UPnP üzerinden otomatik port yönlendirmeyi etkinleştir/devre dışı bırak (varsayılan: 1)
upnp=1

# Kendi dış IP adresinizi ağa duyurmak için (Masternode kurulumlarında önerilir)
# externalip=12.34.56.78:27999

# SOCKS5 Proxy sunucusu kullanarak dış ağlara bağlan (Gizlilik / Trafik yönlendirme)
# proxy=127.0.0.1:9050

# Tor gizli servisleri üzerinden eşlere bağlanmak için ayrı bir SOCKS5 Proxy kullan
# onion=127.0.0.1:9050

# Otomatik olarak Tor gizli servisi oluştur (varsayılan: 1)
# listenonion=1

# ==============================================================================
# 2. RPC (UZAKTAN BAĞLANTI) AYARLARI (RPC Settings)
# ==============================================================================

# rpc komutlarını (kristatech-cli) kabul etmek için sunucu modunu aktif et
server=1

# RPC kullanıcı adı ve şifresi (Güvenliğiniz için çok karmaşık şifreler belirleyin)
rpcuser=kristatechuser
rpcpassword=kristatechpass_lutfen_degistirin

# RPC isteklerine izin verilecek IP adresleri/blokları (Güvenlik için sadece güvenilir IP'ler)
rpcallowip=127.0.0.1
# rpcallowip=192.168.1.0/24

# RPC Port Tanımları (Varsayılan ana ağ: 27979, Testnet: 27919)
rpcport=27979

# RPC isteklerine hizmet verecek iş parçacığı (thread) sayısı (varsayılan: 4)
rpcthreads=4

# RPC çağrılarına hizmet vermek için iş kuyruğu derinliğini ayarla (varsayılan: 16)
rpcworkqueue=16

# RPC HTTP istekleri sırasında zaman aşımı süresi (saniye cinsinden, varsayılan: 30)
rpcservertimeout=30

# ==============================================================================
# 3. VERİTABANI VE İNDEX AYARLARI (Database & Indexing Settings)
# ==============================================================================

# Veritabanı önbellek boyutu (Megabayt cinsinden, varsayılan: 400).
# Senkronizasyonu hızlandırmak için artırılabilir (Örn: 1024 veya 2048)
dbcache=400

# Tüm işlemlerin indeksini tut (Blok gezgini çalıştırmak veya bazı RPC komutları için şarttır)
txindex=1

# Cüzdan başlatılırken blok veritabanını sıfırdan yeniden oluştur (İndeks hatalarını düzeltmek için)
# reindex=1

# ==============================================================================
# 4. CÜZDAN AYARLARI (Wallet Settings)
# ==============================================================================

# Cüzdandaki harcanmamış bakiyeleri (UTXO) tarar (Bakiye hatalarında cüzdanı bununla başlatın)
# rescan=1

# Yedek anahtar havuzu boyutu (Cüzdanın önceden ürettiği adres sayısı, varsayılan: 100)
keypool=100

# Sıfır onaylı (onay almamış) para üstlerinin harcanmasına izin ver (1: Evet, 0: Hayır)
spendzeroconfchange=1

# Gönderilen işlemler için varsayılan işlem ücreti (fee) (KRISTA/kB cinsinden)
# paytxfee=0.0001
# maxtxfee=0.1

# Minimum işlem iletim ücreti (relay fee)
# mintxfee=0.00001

# Tüm cüzdan işlemlerini silip yalnızca blok zincirindeki işlemleri kurtarma (1 veya 2)
# zapwallettxes=1

# ==============================================================================
# 5. HİBRİT ADAM KONSENSÜS VE MADENCİLİK AYARLARI (ADAM Mining & Staking)
# ==============================================================================

# Proof of Stake (PoS) staking özelliğini aktif et (1: Aktif, 0: Pasif)
staking=1

# Klasik PoW madenciliğini (CPU madenciliği) cüzdandan başlatmak için (1: Aktif, 0: Pasif)
# gen=0

# Madencilik veya script doğrulama için kullanılacak iş parçacığı sayısı (varsayılan: -1, 0 = otomatik)
# genproclimit=4

# --- ADAM KONSENSÜS SABİT ADRES PARAMETRELERİ (YENİ) ---
# Madenci havuzunda cüzdanın keypool'dan sürekli yeni adres almasını engellemek için
# madencilik ödül çıktısını tek bir sabit adrese yönlendirir:

# SEÇENEK A: Sabit cüzdan adresi ile madencilik yapma (Özel anahtarı bu cüzdanda bulunmalıdır)
# mineraddress=ktKRDuku8HnUvMtpbTVYs1bJaxbAbcQTcgG

# SEÇENEK B: Doğrudan genel anahtar (33-byte compressed public key hex) kullanarak madencilik yapma
# minerpubkey=02145c77df61f3006603fe22c716cd01505f7a9abe79a76ba00a9a0e9c43a89638

# ==============================================================================
# 6. MASTERNODE AYARLARI (Masternode Settings)
# ==============================================================================

# Bu düğümü Masternode modunda çalıştır (1: Aktif, 0: Pasif)
# masternode=1

# Masternode ECDSA Özel Anahtarı
# masternodeprivkey=93tD5...

# Masternode BLS Özel Anahtarı (Hex formatında)
# masternodeblsprivkey=64_karakterlik_hex_dizisi...

# ==============================================================================
# 7. ANTI-DOS VE SPAM FİLTRELERİ (Spam & Security Settings)
# ==============================================================================

# Düşük miktarlı (spam) staking işlemlerini engellemek için filtre (varsayılan: 1)
blockspamfilter=1

# Spam filtreleme eşik boyutu (varsayılan: 20000000 byte)
blockspamfiltermaxsize=20000000

# Hatalı/uyumsuz paket gönderen düğümlerin banlanma puanı eşiği (varsayılan: 100)
banscore=100

# Banlanan düğümlerin banlı kalma süresi (saniye cinsinden, varsayılan: 86400 (24 saat))
bantime=86400

# ==============================================================================
# 8. ZMQ (SIFIR BAĞLANTILI MESAJLAŞMA) AYARLARI (ZMQ Notifications)
# ==============================================================================
# Blok gezginleri veya harici yazılımların blok/işlem hareketlerini anlık 
# dinleyebilmesi için ZMQ soket bildirimleri:

# zmqpubhashblock=tcp://127.0.0.1:28332
# zmqpubhashtx=tcp://127.0.0.1:28332
# zmqpubrawblock=tcp://127.0.0.1:28332
# zmqpubrawtx=tcp://127.0.0.1:28332

# ==============================================================================
# 9. GÜNLÜK VE HATA AYIKLAMA AYARLARI (Logging & Debugging)
# ==============================================================================

# Log dosyasına yazılacak hata ayıklama kategorileri (Örn: net, coinstake, mempool, vb.)
# debug=net
# debug=coinstake
# debug=mempool
# debug=rpc
# debug=masternode

# Günlük dosyasına bağlanan düğümlerin IP adreslerini yazdır (varsayılan: 1)
logips=1

# İstemci başlangıcında debug.log dosyasını küçült/temizle (varsayılan: 1, debug aktif değilken)
shrinkdebugfile=1

# Log çıktılarını debug.log yerine doğrudan konsola yazdır (varsayılan: 0)
# printtoconsole=0
